<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; worker-src 'self';">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>Boodschappen & Recepten</title>
<style>
:root { color-scheme: light dark; --bg:#f5f5f7; --card:#fff; --text:#111; --muted:#666; --line:#ddd; }
@media (prefers-color-scheme: dark) { :root{--bg:#111;--card:#1c1c1e;--text:#f5f5f7;--muted:#aaa;--line:#333;} }
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:86px}
header{position:sticky;top:0;background:var(--bg);padding:18px 16px 10px;z-index:3}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px}
main{padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h2{font-size:18px;margin:2px 0 10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item input{width:23px;height:23px;margin-top:0;accent-color:#34c759}
.item.done label{text-decoration:line-through;color:var(--muted)}
.controls{display:flex;gap:8px;margin:8px 0 14px}
button{border:0;border-radius:12px;padding:10px 12px;font-size:14px;background:var(--card);color:var(--text)}
.recipe h2{font-size:20px}
.recipe ol,.recipe ul{padding-left:22px}
.recipe li{margin:8px 0;line-height:1.35}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:5}
nav button{flex:1;background:transparent;font-weight:600}
nav button.active{background:var(--bg)}
.hidden{display:none}
.badge{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">Boodschappen</h1>
  <div class="sub" id="subtitle">Tik af wat in je winkelwagen ligt. De vinkjes blijven bewaard.</div>
</header>
<main>
<section id="shoppingView">
<div class="controls">
<button onclick="hideDone()">Afgevinkt verbergen</button>
<button onclick="resetChecks()">Alles terugzetten</button>
</div>
<div id="shopping"></div>
</section>
<section id="recipesView" class="hidden"><div id="recipes"></div></section>
</main>
<nav>
<button id="tabShop" class="active" onclick="showTab('shop')">Boodschappen</button>
<button id="tabRecipes" onclick="showTab('recipes')">Recepten</button>
</nav>
<script>
const shopping={"Groente & fruit": ["1 rode ui", "4 gewone uien", "2 rode paprika's", "2 puntpaprika's", "100 g wortel", "400 g broccoli", "200 g tomaten", "1 citroen", "1 appel", "500 g voorgekookte rode bieten", "400 g verse spinazie", "1 zak rucola (ca. 75 g)", "1 bol knoflook", "1 bosje verse peterselie", "1 bosje verse koriander", "1 bakje verse basilicum"], "Vlees": ["250 g kipfilet", "ca. 250 g kippendijen", "200 g kip", "75 g parmaham"], "Zuivel & gekoeld": ["1 bol mozzarella", "125 g kruidenroomkaas", "75 g geitenkaas", "100 g feta", "75 g geraspte kaas", "200 ml crème fraîche", "100 ml melk", "1 ei", "2 el yoghurt", "20 g Becel ProActiv Original"], "Pasta, rijst & aardappelen": ["250 g vegetarische ravioli", "200 g pasta", "ca. 250 g rijst totaal", "700 g krieltjes"], "Potten, blikken & sauzen": ["1 klein blik kokosmelk", "rode currypasta", "zongedroogde tomaatjes op olie", "1 pot gegrilde paprika's", "pesto", "tomatenpuree of biber salça", "kippenbouillon", "balsamicoazijn"], "Noten, kruiden & voorraad": ["50 g walnoten", "pijnboompitten", "pul biber", "gerookt paprikapoeder", "oregano", "komijn", "cajunkruiden", "laurierblaadjes", "olijfolie / bakolie", "vloeibare bakmargarine", "peper", "zout"]};
const recipes=[{"title": "Rode curry met kip en groenten", "time": "ca. 20 min", "ingredients": ["250 g kipfilet", "1 rode ui", "1 rode paprika", "100 g wortel", "½ blik kokosmelk", "1 el rode currypasta", "verse koriander", "1 el vloeibare bakmargarine", "20 g ProActiv", "1 bouillonblokje", "ca. 150 g rijst"], "steps": ["Snijd kip, ui, paprika en wortel in reepjes.", "Bak de ui glazig. Voeg wortel en paprika toe en bak ongeveer 5 minuten.", "Bak de kip rondom bruin en voeg de groenten weer toe.", "Voeg kokosmelk, 50 ml water, currypasta en bouillonblokje toe. Laat circa 5 minuten koken.", "Roer de ProActiv er van het vuur door en serveer met rijst en koriander."]}, {"title": "Turkse traybake met kip en rijst", "time": "ca. 75 min", "ingredients": ["ca. 250 g kippendijen", "100 g rijst", "2 uien", "1-2 tenen knoflook", "2 puntpaprika's", "80 g tomaten", "ca. 200 ml kippenbouillon", "½ citroen", "1 laurierblaadje", "verse peterselie", "olijfolie, pul biber, gerookt paprikapoeder, oregano, komijn, tomatenpuree, peper en zout"], "steps": ["Verwarm de oven voor op 200 °C en spoel de rijst.", "Meng de marinade en hussel ui, knoflook en kip ermee. Voeg puntpaprika toe.", "Bak 30 minuten.", "Roer rijst en een deel van de fijngesneden paprika door de schaal.", "Voeg tomaat, laurier, citroen en bouillon toe en bak nog ongeveer 30 minuten.", "Bestrooi met peterselie."]}, {"title": "Ravioli met spinazie en mozzarella", "time": "ca. 20 min", "ingredients": ["250 g vegetarische ravioli", "400 g verse spinazie", "1 bol mozzarella", "125 g kruidenroomkaas", "2 el zongedroogde tomaatjes", "1 ui", "verse peterselie"], "steps": ["Kook de ravioli volgens de verpakking.", "Bak de ui glazig en laat de spinazie slinken.", "Roer kruidenroomkaas en zongedroogde tomaatjes erdoor.", "Meng de ravioli door de saus en verdeel de mozzarella erover.", "Garneer met peterselie."]}, {"title": "Pastasalade met geitenkaas", "time": "ca. 20 min", "ingredients": ["200 g pasta", "2 gegrilde paprika's", "75 g parmaham", "75 g geitenkaas", "1 handje rucola", "1 flinke el pesto", "2 el pijnboompitten", "verse basilicum"], "steps": ["Kook de pasta en laat afkoelen.", "Meng de pesto door de pasta.", "Voeg gegrilde paprika en parmaham toe.", "Werk af met rucola, geitenkaas, basilicum en pijnboompitten."]}, {"title": "Bietensalade met feta", "time": "ca. 10 min", "ingredients": ["1 appel", "500 g voorgekookte rode bieten", "2 el balsamicoazijn", "2 el yoghurt", "1 el citroensap", "50 g walnoten", "40 g rucola", "100 g feta", "olijfolie", "peper en zout"], "steps": ["Snijd bieten en appel.", "Meng met citroensap, balsamico, yoghurt, peper en zout.", "Meng walnoten, rucola en feta erdoor.", "Besprenkel met olijfolie."]}, {"title": "Ovenschotel met kip en broccoli", "time": "ca. 70 min", "ingredients": ["200 g kip", "700 g krieltjes", "400 g broccoli", "1 rode paprika", "1 ui", "1 el cajunkruiden", "1 tl gerookt paprikapoeder", "75 g geraspte kaas", "200 ml crème fraîche", "1 ei", "100 ml melk", "peper, zout en olie/boter"], "steps": ["Verwarm de oven voor op 180 °C.", "Kook krieltjes en broccoli ongeveer 5 minuten voor.", "Fruit ui, voeg paprika en daarna kip en kruiden toe.", "Meng alles in een ingevette ovenschaal.", "Klop crème fraîche met ei, melk, peper en zout en giet erover. Bestrooi met kaas.", "Bak circa 40 minuten."]}];
const storeKey='ruud-boodschappen-checks-v1';
let checks=JSON.parse(localStorage.getItem(storeKey)||'{}');
let doneHidden=false;

function renderShopping(){
  const root=document.getElementById('shopping'); root.innerHTML='';
  let index=0;
  Object.entries(shopping).forEach(([cat,items])=>{
    const card=document.createElement('div'); card.className='card';
    const h=document.createElement('h2'); h.textContent=cat; card.appendChild(h);
    items.forEach(text=>{
      const id='i'+(index++);
      const row=document.createElement('div'); row.className='item'+(checks[id]?' done':'');
      if(doneHidden && checks[id]) row.style.display='none';
      const cb=document.createElement('input'); cb.type='checkbox'; cb.id=id; cb.checked=!!checks[id];
      cb.onchange=()=>{checks[id]=cb.checked; localStorage.setItem(storeKey,JSON.stringify(checks)); renderShopping();};
      const lab=document.createElement('label'); lab.htmlFor=id; lab.textContent=text;
      row.append(cb,lab); card.appendChild(row);
    });
    root.appendChild(card);
  });
}
function hideDone(){doneHidden=!doneHidden; renderShopping(); event.target.textContent=doneHidden?'Alles tonen':'Afgevinkt verbergen';}
function resetChecks(){ if(confirm('Alle vinkjes wissen?')){checks={};localStorage.setItem(storeKey,'{}');renderShopping();}}
function renderRecipes(){
 const root=document.getElementById('recipes'); root.innerHTML='';
 recipes.forEach(r=>{
   const card=document.createElement('article'); card.className='card recipe';
   card.innerHTML=`<h2>${r.title}</h2><div class="badge">${r.time} · 2 personen</div>
   <h3>Ingrediënten</h3><ul>${r.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul>
   <h3>Bereiding</h3><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`;
   root.appendChild(card);
 });
}
function showTab(tab){
 const shop=tab==='shop';
 document.getElementById('shoppingView').classList.toggle('hidden',!shop);
 document.getElementById('recipesView').classList.toggle('hidden',shop);
 document.getElementById('tabShop').classList.toggle('active',shop);
 document.getElementById('tabRecipes').classList.toggle('active',!shop);
 document.getElementById('pageTitle').textContent=shop?'Boodschappen':'Recepten';
 document.getElementById('subtitle').textContent=shop?'Tik af wat in je winkelwagen ligt. De vinkjes blijven bewaard.':'Alle recepten voor 2 personen.';
}
renderShopping();renderRecipes();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
