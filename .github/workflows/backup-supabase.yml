name: Backup Supabase data

# Zet elke dag een export van de app-data (tabel app_kv: boodschappenlijst,
# recepten, planner, etc.) én een spiegel van de recept-foto's
# (Storage-bucket recipe-photos) weg in de privé-repo
# Backup-Supabase-boodschappen-.
#
# Eenmalige setup (zie README hieronder in deze workflow):
# 1. Privé GitHub-repo "Backup-Supabase-boodschappen-" bestaat al.
# 2. Maak een fine-grained Personal Access Token met "Contents: Read and write"
#    rechten, alleen voor die repo.
# 3. Zet dat token als repository secret BACKUP_REPO_TOKEN in deze repo
#    (Settings > Secrets and variables > Actions > New repository secret).
# 4. Zet ook de "service_role" sleutel van het Supabase-project (Project
#    Settings > API > service_role secret) als repository secret
#    SUPABASE_SERVICE_ROLE_KEY. Deze is nodig om de inhoud van de
#    foto-bucket te kunnen opsommen en downloaden (de publieke sleutel mag
#    dat niet); deze sleutel wordt alleen hier gebruikt, nooit in de app zelf.

on:
  schedule:
    - cron: '5 4 * * *'   # elke dag om 04:05 UTC
  workflow_dispatch:        # met de hand starten kan ook

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      BACKUP_REPO: 65RuudKoene/Backup-Supabase-boodschappen-
      SUPABASE_URL: https://uutvmhoplasohgucxopa.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Data ophalen bij Supabase
        env:
          SUPABASE_KEY: sb_publishable_NovRjFhaUMhu_LYHT2eV8g_h-pM525j
        run: |
          set -euo pipefail
          code=$(curl -sS -o backup.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/app_kv?select=household,k,v,updated_at" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase antwoordde met HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Backup mislukt, geen geldig antwoord van Supabase"; exit 1
          fi

      - name: Backup wegschrijven naar privé-repo
        if: ${{ env.BACKUP_REPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          date=$(date -u +%Y-%m-%d)
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" backup-repo
          mkdir -p backup-repo/supabase
          cp backup.json "backup-repo/supabase/app_kv-${date}.json"

          cd backup-repo
          # oude dumps opruimen, de laatste 90 bewaren
          ls -1t supabase/app_kv-*.json 2>/dev/null | tail -n +91 | xargs -r rm --

          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in app_kv, niets te committen"
          else
            git commit -m "Backup app_kv ${date}"
            git push
          fi

      - name: Recept-foto's spiegelen naar privé-repo
        if: ${{ env.BACKUP_REPO_TOKEN != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ ! -d backup-repo ]; then
            git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" backup-repo
          fi
          cd backup-repo
          mkdir -p supabase/photos
          # spiegel = eerst leegmaken, dan opnieuw vullen, zodat verwijderde
          # foto's ook uit de backup verdwijnen
          find supabase/photos -mindepth 1 -delete

          list_prefix() {
            curl -sS -X POST "$SUPABASE_URL/storage/v1/object/list/recipe-photos" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "content-type: application/json" \
              -d "{\"prefix\":\"$1\",\"limit\":1000,\"sortBy\":{\"column\":\"name\",\"order\":\"asc\"}}"
          }

          # Padstructuur is household/bestand.jpg (zie uploadRecipePhoto() in
          # index.html) — een "map" (household) komt terug met metadata=null,
          # een echt bestand heeft altijd metadata.
          folders=$(list_prefix "" | jq -r '.[] | select(.metadata == null) | .name')
          for folder in $folders; do
            mkdir -p "supabase/photos/$folder"
            files=$(list_prefix "$folder/" | jq -r '.[] | select(.metadata != null) | .name')
            for file in $files; do
              path="$folder/$file"
              curl -sS -o "supabase/photos/$path" \
                "$SUPABASE_URL/storage/v1/object/recipe-photos/$path" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
            done
          done

          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add supabase/photos
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in foto's, niets te committen"
          else
            git commit -m "Spiegel recept-foto's $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Secrets ontbreken nog
        if: ${{ env.BACKUP_REPO_TOKEN == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: |
          if [ -z "${BACKUP_REPO_TOKEN}" ]; then
            echo "::warning::BACKUP_REPO_TOKEN secret is nog niet ingesteld, backup is opgehaald maar niet weggeschreven. Zie de comments bovenin dit workflow-bestand."
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret is nog niet ingesteld, de recept-foto's worden niet geback-upt. Zie de comments bovenin dit workflow-bestand."
          fi
